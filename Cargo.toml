[package]
name = "pitwall"
version = "0.1.0"
edition = "2021"
description = "AI workspace awareness and continuity layer for Omarchy developers"
license = "MIT"
# repository = "<set when the public GitHub repo exists>"
keywords = ["omarchy", "workspace", "developer-tools"]
categories = ["command-line-utilities"]

[[bin]]
name = "pitwall"
path = "src/main.rs"

[lib]
name = "pitwall_lib"
path = "src/lib.rs"

[dependencies]
# Sole third-party dependency (M2): SQLite access for the local continuity
# cache. `bundled` builds SQLite from source — no system library required,
# keeping installs robust and the build offline-repeatable via Cargo.lock.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# Property-based test runner. Test-only: never linked into the shipped binary.
# Pinned exactly so property runs are reproducible across machines and CI.
proptest = "=1.5.0"

[profile.release]
lto = true
codegen-units = 1
